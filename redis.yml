apiVersion: v1
kind: Pod
metadata:
  name: ais-redis
spec:
  containers:
    - name: redis
      image: docker.io/library/redis:alpine
      command:
        - redis-server
        - --appendonly
        - "yes"
        - --appendfsync
        - everysec
      ports:
        - containerPort: 6379
          hostPort: 6379
      volumeMounts:
        - name: redis-data
          mountPath: /data
  volumes:
    - name: redis-data
      hostPath:
        path: ./redis-data
        type: DirectoryOrCreate
